<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --surface: #141414;
    --border: #222;
    --text: #d8d4cc;
    --muted: #555;
    --accent: #b8a878;
    --white: #edeae2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(12,12,12,0.95);
    backdrop-filter: blur(10px);
    z-index: 100;
  }

  .logo {
    font-family: 'EB Garamond', serif;
    font-size: 20px;
    letter-spacing: 0.08em;
    color: var(--white);
  }

  .nav-search {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    padding: 8px 16px;
    background: var(--surface);
    width: 260px;
    transition: border-color 0.2s;
  }
  .nav-search:focus-within { border-color: var(--accent); }
  .nav-search input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    width: 100%;
  }
  .nav-search input::placeholder { color: var(--muted); }
  .nav-search svg { color: var(--muted); flex-shrink: 0; }

  /* HERO */
  .hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 380px;
    border-bottom: 1px solid var(--border);
  }

  .hero-left {
    padding: 72px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }

  .hero-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }

  .hero-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(38px, 4.5vw, 58px);
    line-height: 1.05;
    color: var(--white);
    font-weight: 400;
  }
  .hero-title em { font-style: italic; color: var(--accent); }

  .hero-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.65;
    max-width: 300px;
    font-weight: 300;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 22px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    width: fit-content;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .btn-primary:hover { background: var(--accent); color: var(--bg); }

  .hero-right {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    overflow: hidden;
  }

  .hero-cards {
    position: relative;
    width: 280px;
    height: 340px;
  }

  .hero-card {
    position: absolute;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    transition: transform 0.4s ease;
  }
  .hero-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top;
    filter: grayscale(100%);
    display: block;
  }
  .hero-card:nth-child(1) { width: 155px; height: 215px; top: 30px; left: 0; transform: rotate(-7deg); z-index: 1; }
  .hero-card:nth-child(2) { width: 170px; height: 235px; top: 10px; left: 50%; transform: translateX(-50%) rotate(-1deg); z-index: 3; }
  .hero-card:nth-child(3) { width: 155px; height: 215px; top: 40px; right: 0; transform: rotate(6deg); z-index: 2; }
  .hero-cards:hover .hero-card:nth-child(1) { transform: rotate(-11deg) translateX(-6px) translateY(-4px); }
  .hero-cards:hover .hero-card:nth-child(2) { transform: translateX(-50%) rotate(-1deg) translateY(-10px); }
  .hero-cards:hover .hero-card:nth-child(3) { transform: rotate(10deg) translateX(6px) translateY(-4px); }

  /* FILTERS */
  .filters-bar {
    padding: 20px 48px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters-bar::-webkit-scrollbar { display: none; }

  .filter-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .pill {
    padding: 5px 14px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.03em;
  }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500; }

  /* GRID */
  .grid-section { padding: 40px 48px 80px; }

  .grid-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 28px;
  }

  .grid-title {
    font-family: 'EB Garamond', serif;
    font-size: 20px;
    color: var(--white);
    font-weight: 400;
  }

  .grid-count {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
  }

  .char-card {
    background: var(--bg);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .char-card:hover .char-card-img img { transform: scale(1.05); filter: grayscale(0%); }
  .char-card:hover .char-overlay { opacity: 1; }

  .char-card-img {
    aspect-ratio: 2/3;
    overflow: hidden;
    background: var(--surface);
    position: relative;
  }
  .char-card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
    filter: grayscale(30%);
    transition: transform 0.4s ease, filter 0.3s ease;
  }

  .char-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(12,12,12,0.85) 0%, transparent 55%);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: flex-end;
    padding: 14px;
  }

  .char-like {
    margin-left: auto;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    transition: color 0.2s, transform 0.2s;
    line-height: 1;
  }
  .char-like:hover { color: #c45; transform: scale(1.2); }
  .char-like.liked { color: #c45; }

  .char-card-info {
    padding: 10px 12px 12px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }
  .char-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .char-anime {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .char-genre-tag {
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.06em;
  }

  /* LOAD MORE */
  .load-more {
    text-align: center;
    margin-top: 48px;
  }
  .btn-load {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 32px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-load:hover { border-color: var(--accent); color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .char-card { animation: fadeUp 0.4s ease both; }

  @media (max-width: 1100px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 860px)  { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px)  {
    .hero { grid-template-columns: 1fr; }
    .hero-right { display: none; }
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
    nav, .filters-bar, .grid-section, .hero-left { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Sketchbook</div>
  <div class="nav-search">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="Search characters..." id="search-input" oninput="onSearch()">
  </div>
</nav>

<section class="hero">
  <div class="hero-left">

    <h1 class="hero-title">Find Your<br>Next Character<br>to <em>Sketch.</em></h1>

    <button class="btn-primary" onclick="document.querySelector('.grid-section').scrollIntoView({behavior:'smooth'})">
      Browse All
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="hero-right">
    <div class="hero-cards" id="hero-cards"></div>
  </div>
</section>

<div class="filters-bar" id="filters-bar">
  <span class="filter-label">Genre</span>
</div>

<section class="grid-section">
  <div class="grid-header">
    <h2 class="grid-title">All Characters</h2>
    <span class="grid-count" id="grid-count"></span>
  </div>
  <div class="cards-grid" id="cards-grid"></div>
  <div class="load-more" id="load-more-wrap">
    <button class="btn-load" onclick="loadMore()">
      Load More
      <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </button>
  </div>
</section>

/images/characters/2/314931.jpg","anime":"Ghost in the Shell","genre":["Sci-Fi","Action"]}];

const PAGE = 20;
let filtered = [...ALL];
let shown = 0;
let activeGenre = 'All';

// Build genre pills
const genres = ['All', ...new Set(ALL.flatMap(c => c.genre).filter(g => g !== 'Unknown'))].sort((a,b) => a==='All'?-1:b==='All'?1:a.localeCompare(b));
const bar = document.getElementById('filters-bar');
genres.forEach(g => {
  const btn = document.createElement('button');
  btn.className = 'pill' + (g === 'All' ? ' active' : '');
  btn.textContent = g;
  btn.onclick = () => setGenre(g, btn);
  bar.appendChild(btn);
});

// Hero cards
const heroImgs = [ALL[0], ALL[2], ALL[3]];
const hc = document.getElementById('hero-cards');
heroImgs.forEach(c => {
  const d = document.createElement('div');
  d.className = 'hero-card';
  d.innerHTML = `<img src="${c.image}" alt="${c.name}" loading="lazy">`;
  hc.appendChild(d);
});

function buildCard(c, i) {
  const d = document.createElement('div');
  d.className = 'char-card';
  d.style.animationDelay = (i % PAGE * 0.03) + 's';
  d.innerHTML = `
    <div class="char-card-img">
      <img src="${c.image}" alt="${c.name}" loading="lazy">
      <div class="char-overlay">
        <span class="char-like" onclick="event.stopPropagation();toggleLike(this)">♡</span>
      </div>
    </div>
    <div class="char-card-info">
      <div class="char-name">${c.name}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
        <span class="char-genre-tag">${c.genre[0] || ''}</span>
        <span class="char-anime">${c.anime !== 'Unknown' ? c.anime : ''}</span>
      </div>
    </div>`;
  return d;
}

function renderMore() {
  const grid = document.getElementById('cards-grid');
  const batch = filtered.slice(shown, shown + PAGE);
  batch.forEach((c, i) => grid.appendChild(buildCard(c, shown + i)));
  shown += batch.length;
  document.getElementById('grid-count').textContent = `${shown} of ${filtered.length}`;
  document.getElementById('load-more-wrap').style.display = shown >= filtered.length ? 'none' : '';
}

function reset() {
  shown = 0;
  document.getElementById('cards-grid').innerHTML = '';
  renderMore();
}

function setGenre(g, btn) {
  activeGenre = g;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const q = document.getElementById('search-input').value.toLowerCase();
  applyFilters(q);
}

function onSearch() {
  const q = this.value !== undefined ? this.value.toLowerCase() : document.getElementById('search-input').value.toLowerCase();
  applyFilters(q);
}

function applyFilters(q) {
  filtered = ALL.filter(c => {
    const genreOk = activeGenre === 'All' || c.genre.includes(activeGenre);
    const searchOk = !q || c.name.toLowerCase().includes(q) || c.anime.toLowerCase().includes(q);
    return genreOk && searchOk;
  });
  reset();
}

function loadMore() { renderMore(); }
function toggleLike(el) {
  el.classList.toggle('liked');
  el.textContent = el.classList.contains('liked') ? '♥' : '♡';
}

reset();
</script>
